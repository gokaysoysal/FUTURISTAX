name: CI

on:
  push: { branches: [main, v2] }
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Derleme sırasında gereken yer tutucular.
#
# Buraya GERÇEK anahtar biçiminde değer YAZILMAZ — Cloudflare'in herkese açık
# test anahtarları bile olsa. Sebebi: Netlify'ın sır tarayıcısı, ortam
# değişkenlerinin değerlerini depo dosyalarında arar. Depoda birebir aynı metin
# bulunursa derleme durur. Ayrıca bu alışkanlık, bir gün gerçek bir anahtarın
# yanlışlıkla buraya yazılmasını kolaylaştırır.
#
# CI derlemesinin tek ihtiyacı, Zod şemasının `.min(1)` kontrolünü geçen boş
# olmayan bir metindir. Anlamlı olması gerekmez.
env:
  NEXT_PUBLIC_SITE_URL: https://example.invalid
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: ci-yer-tutucu
  NEXT_PUBLIC_SANITY_PROJECT_ID: ci-yer-tutucu
  NEXT_PUBLIC_SANITY_DATASET: production

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile
      - name: Tip kontrolü
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Birim testleri ve kapsam
        run: pnpm test
      - name: Derleme
        run: pnpm build

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Uçtan uca ve erişilebilirlik testleri
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report }

  lighthouse:
    needs: quality
    runs-on: ubuntu-latest
    # Performans bütçesi Aşama 12'de BLOKLAYICI hale gelecek.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Lighthouse CI
        run: pnpm dlx @lhci/cli autorun --config=lighthouserc.json
