name: CI

on:
  push: { branches: [main, v2] }
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Derleme sırasında gereken herkese açık değişkenler. Bunlar sır DEĞİLDİR:
# Turnstile anahtarı Cloudflare'in resmî "her zaman geçer" test anahtarıdır,
# diğerleri yer tutucudur. Gerçek değerler Netlify ortam değişkenlerinde tutulur.
env:
  NEXT_PUBLIC_SITE_URL: https://futuristax.com
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
  NEXT_PUBLIC_SANITY_PROJECT_ID: placeholder
  NEXT_PUBLIC_SANITY_DATASET: production

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile
      - name: Tip kontrolü
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Birim testleri ve kapsam
        run: pnpm test
      - name: Derleme
        run: pnpm build

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Uçtan uca ve erişilebilirlik testleri
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report }

  lighthouse:
    needs: quality
    runs-on: ubuntu-latest
    # Performans bütçesi Aşama 12'de BLOKLAYICI hale gelecek. Şimdilik yalnızca
    # rapor üretir: ortam değişkenleri ve içerik tamamlanmadan gerçekçi bir
    # ölçüm alınamaz, erken kırmızı uyarı körlüğü yaratır.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Lighthouse CI
        run: pnpm dlx @lhci/cli autorun --config=lighthouserc.json
