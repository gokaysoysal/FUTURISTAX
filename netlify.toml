# Netlify yapılandırması
#
# Bu depo bir pnpm monorepo'sudur. Netlify'ın varsayılan davranışı kök dizini
# statik olarak yayınlamaktır — eski tek dosyalık site böyle çalışıyordu.
# Aşağıdaki ayarlar Netlify'a kökten kurulum yapmasını ama Next.js uygulamasını
# apps/web altından derlemesini söyler.

[build]
  # Kök dizinde kalınır: pnpm workspace bağımlılıkları ancak buradan çözülür.
  command = "pnpm build --filter @futuristax/web"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22"
  # Kilit dosyasına birebir uyulur; sessiz sürüm kayması olmaz.
  PNPM_FLAGS = "--frozen-lockfile"
  # Next.js derleme sırasında telemetri göndermesin.
  NEXT_TELEMETRY_DISABLED = "1"

# Next.js çalışma zamanı: SSR, API route'ları ve ISR bunun üzerinden çalışır.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ── Güvenlik başlıkları ────────────────────────────────────────────────────
# Not: Content-Security-Policy burada TANIMLANMAZ. CSP nonce tabanlıdır ve
# her istek için middleware.ts içinde üretilir. Burada sabit bir CSP yazmak
# nonce'u geçersiz kılar ve sayfayı bozar.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Dağıtım bağlamları ─────────────────────────────────────────────────────
# Üretim (main dalı) Aşama 3 tamamlanana kadar ESKİ SİTEYİ yayınlamaya devam
# eder. Yeni sürüm yalnızca dal önizlemelerinde çalışır. Geçiş, v2 main'e
# birleştirildiğinde ve DNS doğrulandığında yapılır.

[context.deploy-preview.environment]
  NEXT_PUBLIC_SITE_URL = "https://deploy-preview-1--futuristax.netlify.app"

[context.branch-deploy.environment]
  NEXT_PUBLIC_SITE_URL = "https://v2--futuristax.netlify.app"
